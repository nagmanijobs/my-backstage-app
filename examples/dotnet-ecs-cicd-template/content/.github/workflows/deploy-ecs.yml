name: Deploy .NET App to ECS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ values.awsRegion }}
  AWS_ROLE_ARN: ${{ values.awsRoleArn }}
  ECR_REPOSITORY: ${{ values.ecrRepository }}
  ECS_CLUSTER: ${{ values.ecsClusterName }}
  ECS_SERVICE: ${{ values.ecsServiceName }}
  ECS_TASK_DEFINITION: ecs/task-definition.json
  CONTAINER_NAME: ${{ values.containerName }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: {% raw %}${{ env.AWS_ROLE_ARN }}{% endraw %}
          aws-region: {% raw %}${{ env.AWS_REGION }}{% endraw %}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: {% raw %}${{ steps.login-ecr.outputs.registry }}{% endraw %}
          IMAGE_TAG: {% raw %}${{ github.sha }}{% endraw %}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Render ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: {% raw %}${{ env.ECS_TASK_DEFINITION }}{% endraw %}
          container-name: {% raw %}${{ env.CONTAINER_NAME }}{% endraw %}
          image: {% raw %}${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}{% endraw %}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: {% raw %}${{ steps.task-def.outputs.task-definition }}{% endraw %}
          service: {% raw %}${{ env.ECS_SERVICE }}{% endraw %}
          cluster: {% raw %}${{ env.ECS_CLUSTER }}{% endraw %}
          wait-for-service-stability: true
